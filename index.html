<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>COMP2132 - Hangman</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="js/hangman.js" defer></script>
</head>
<body>

	<header id="site-header">
		<div class="wrapper">
			<p class="site-title">Hangman</p>
		</div>
	</header>

	<main>

		<section class="first-view">
			<div class="wrapper">
				<h1>Guess the word!</h1>
				<p>Choose letters before the drawing is finished. Up to 6 wrong guesses.</p>
			</div>
		</section>

		<section class="section" id="game">
			<div class="wrapper">
				<div class="game-layout">

					<div class="game-card figure-card">
						<img id="hangman-image" class="hangman-image" src="images/hangman-0.jpg" alt="Hangman drawing, no mistakes yet">
						<p class="attempts">
							Wrong guesses:
							<span id="wrong-count">0</span> / <span id="max-wrong">6</span>
						</p>
					</div>

					<div class="game-card play-card">
						<p class="hint">
							<span class="hint-label">Hint:</span>
							<span id="hint-text">Loading...</span>
						</p>

						<div id="word-display" class="word-display" aria-live="polite"></div>

						<form id="guess-form" class="guess-form" autocomplete="off">
							<label for="guess-input" class="guess-label">Type a letter</label>
							<input id="guess-input" class="guess-input" type="text" maxlength="1" inputmode="text" pattern="[A-Za-z]" aria-label="Enter a letter">
						</form>

						<div id="keyboard" class="keyboard" aria-label="Letter buttons"></div>

						<div id="result" class="result" hidden>
							<p id="result-message" class="result-message"></p>
							<button id="play-again" class="button" type="button">Play Again</button>
						</div>
					</div>

				</div>
			</div>
		</section>

	</main>

	<footer id="site-footer">
		<div class="wrapper">
			<p>By Rico Natanael</p>
		</div>
	</footer>

</body>
</html>
